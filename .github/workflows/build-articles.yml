name: Build Articles Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown python-frontmatter beautifulsoup4 lxml pyyaml

      - name: Build Articles
        run: |
          python scripts/build_articles.py

      - name: Verify generated files
        run: |
          test -f index.html
          test -f data/articles.json
          test -f sitemap.xml
          test -d articles
          echo "Build completed and required files exist."
